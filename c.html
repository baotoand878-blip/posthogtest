

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>事件与错误测试页面</title>
   <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SGPQ2LSFLJ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-SGPQ2LSFLJ');
</script>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .test-box { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        button { cursor: pointer; padding: 5px 10px; }
        #log { background: #f4f4f4; padding: 10px; border-left: 5px solid #333; height: 150px; overflow-y: auto; }
        #service {background: #10B4F4; float:right;width:50px;height:100px; }
    </style>
</head>
<body>

    <h2>交互事件测试</h2>
    
    <div class="test-box">
        <!-- 按钮点击事件测试 -->
        <button id="clickBtn">点击我测试 Click</button>
        
        <!-- 错误触发测试 -->
        <button id="errorBtn" style="color: red;">触发一个 JS 错误</button>
        
        <!-- 资源加载错误测试 -->
        <button id="imgErrorBtn">触发图片加载错误</button>
        <div id="service">我是客服插件！！</div>
    </div>

    <div class="test-box">
        <label for="inputTest">输入测试 (input): </label>
        <input type="text" id="inputTest" placeholder="在这里打字...">
    </div>

    <h3>控制台输出预览:</h3>
    <div id="log"></div>

    <script>
        const logDiv = document.getElementById('log');
        function printLog(msg) {
            const p = document.createElement('p');
            p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logDiv.prepend(p);
        }

        // 1. 点击事件 [W3Schools](https://www.w3schools.com/jsref/event_onclick.asp)
        document.getElementById('clickBtn').addEventListener('click', () => {
            printLog("成功捕获到 Click 事件！");
        });

        // 2. 触发运行时错误 (ReferenceError)
        document.getElementById('errorBtn').addEventListener('click', () => {
            printLog("尝试执行未定义的函数...");
            nonExistentFunction(); // 这里会报错
        });

        // 3. 资源加载错误 [MDN Web Docs](https://developer.mozilla.org)
        document.getElementById('imgErrorBtn').addEventListener('click', () => {
            const img = new Image();
            img.onerror = () => printLog("❌ 图片加载失败 (Error 事件)");
            img.src = "invalid-path.jpg"; 
        });

        // 4. 输入事件
        document.getElementById('inputTest').addEventListener('input', (e) => {
            printLog(`正在输入: ${e.target.value}`);
        });

        // 全局捕获 JS 错误
        window.onerror = function(msg, url, line) {
            printLog(`🔥 全局捕获错误: ${msg} (第${line}行)`);
            return false; // 允许错误继续在控制台显示
        };
    </script>
</body>
</html>
